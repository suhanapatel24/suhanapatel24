apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-release-api
  labels:
    app.kubernetes.io/name: gitops-release-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gitops-release-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitops-release-api
    spec:
      serviceAccountName: gitops-release-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/suhanapatel24/gitops-release-api:dev
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: dev
            - name: APP_ENV
              value: dev
            - name: GIT_SHA
              value: local
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
