apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-release-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/suhanapatel24/suhanapatel24.git
    targetRevision: main
    path: gitops-platform/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
